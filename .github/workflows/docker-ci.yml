name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:

  # ==========================================
  # 1. AUTOMATED TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          python -m pytest test_app.py


  # ==========================================
  # 2. BUILD + PUSH API IMAGE
  # ==========================================
  build-and-push-api:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-api:${{ github.sha }}


  # ==========================================
  # 3. BUILD + PUSH FRONTEND IMAGE
  # ==========================================
  build-and-push-frontend:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-frontend:${{ github.sha }}


  # ==========================================
  # 4. BUILD + PUSH GATEWAY IMAGE
  # ==========================================
  build-and-push-gateway:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-gateway:${{ github.sha }}


  # ==========================================
  # 5. DEPLOY TO EC2 + HEALTH CHECK + ROLLBACK
  # ==========================================
  deploy-to-ec2:
    needs:
      - build-and-push-api
      - build-and-push-frontend
      - build-and-push-gateway

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:
      - name: Deploy on EC2
        run: |
          cd ~/docker-real-project

          PREVIOUS_TAG=$(cat current_image_tag)

          echo "Previous version: $PREVIOUS_TAG"
          echo "Deploying version: ${{ github.sha }}"

          # Pull new version
          IMAGE_TAG=${{ github.sha }} docker compose -f compose.prod.yaml pull

          # Deploy new version
          IMAGE_TAG=${{ github.sha }} docker compose -f compose.prod.yaml up -d

          # Check application health
          if curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            http://localhost:8080/api/health
          then

            echo ""
            echo "Deployment successful"
            echo "${{ github.sha }}" > current_image_tag

          else

            echo ""
            echo "Health check failed"
            echo "Rolling back to $PREVIOUS_TAG"

            # Pull previous known-good version
            IMAGE_TAG=$PREVIOUS_TAG docker compose -f compose.prod.yaml pull

            # Roll back
            IMAGE_TAG=$PREVIOUS_TAG docker compose -f compose.prod.yaml up -d

            # Verify rollback
            curl --fail --silent --show-error \
              --retry 5 \
              --retry-delay 3 \
              --retry-connrefused \
              http://localhost:8080/api/health

            echo ""
            echo "Rollback completed"

            # Keep GitHub Actions RED because new deployment failed
            exit 1

          fi